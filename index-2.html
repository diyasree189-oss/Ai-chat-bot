<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chatbot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="chat-app">
    <header class="chat-header">
      <div>
        <h1>AI Chatbot</h1>
        <p>Your simple browser-based assistant</p>
      </div>
      <button id="clearBtn" class="clear-btn">Clear</button>
    </header>

    <main id="chatBox" class="chat-box">
      <div class="message bot">
        <strong>Bot</strong>
        <p>Hello! I'm your AI-style chatbot. Ask me something!</p>
      </div>
    </main>

    <form id="chatForm" class="input-area">
      <input id="userInput" type="text" placeholder="Type your message..." autocomplete="off" required>
      <button type="submit">Send</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
